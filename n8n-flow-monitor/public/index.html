<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>n8n testing rig — TravelAdvisor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #3fb8af;
      --err: #f07178;
      --warn: #e6c07b;
      --mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #243044;
      color: var(--muted);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 0;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    aside {
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow: auto;
      max-height: calc(100vh - 56px);
    }
    main { padding: 1rem; overflow: auto; max-height: calc(100vh - 56px); }
    .exec-list button {
      width: 100%;
      text-align: left;
      margin-bottom: 0.5rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .exec-list button:hover, .exec-list button.active {
      border-color: var(--accent);
      background: #1f2d3d;
    }
    .exec-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
    .status-ok { color: var(--accent); }
    .status-err { color: var(--err); }
    .status-run { color: var(--warn); }
    .node-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      overflow: hidden;
      background: var(--panel);
    }
    .node-head {
      padding: 0.55rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      background: #222c3c;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .node-head strong { font-weight: 600; }
    .node-body { padding: 0 0.85rem 0.85rem; display: none; }
    .node-card.open .node-body { display: block; }
    pre {
      margin: 0.5rem 0 0;
      padding: 0.75rem;
      background: #0d1117;
      border-radius: 6px;
      overflow: auto;
      font-size: 0.72rem;
      line-height: 1.35;
      font-family: var(--mono);
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre.src { border-left: 3px solid #4a6988; max-height: 320px; }
    pre.tgt { border-left: 3px solid var(--accent); max-height: 480px; }
    pre.src-sm { border-left: 3px solid #6b5794; max-height: 200px; }
    h4.io {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0.85rem 0 0.25rem;
      font-weight: 600;
    }
    .exec-tools { margin-bottom: 0.65rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .exec-tools button {
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #243044;
      color: var(--text);
      cursor: pointer;
    }
    .exec-tools button:hover { border-color: var(--accent); }
    .muted-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-left: 3px solid var(--accent);
      background: #1a2330;
    }
    .empty { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>n8n testing rig</h1>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:0.2rem">
        Each activated step: <strong style="color:var(--accent)">IN</strong> (resolved from <code>source</code>)
        plus <strong style="color:var(--accent)">OUT</strong> (<code>data.main</code>). Keep page open — SSE pushes as runData fills.
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center">
      <span class="pill" id="connPill"><span class="dot" id="connDot"></span> <span id="connText">connecting…</span></span>
      <span class="pill" id="wfPill">workflow: —</span>
    </div>
  </header>
  <div class="layout">
    <aside>
      <div class="hint" id="hint">
        Loading…
      </div>
      <div class="exec-list" id="execList"></div>
    </aside>
    <main id="detail">
      <p class="empty">Select an execution or trigger <code>POST /webhook/chat</code> from the app.</p>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);

    let executions = [];
    let selectedId = null;
    let eventSource = null;
    /** Dedupe overlapping GET /executions:id while SSE churns */
    const hydrateInflightById = new Map();
    /** Finished executions where API honestly returned zero timeline rows (avoid hammering). */
    const terminalEmptyHydrated = new Set();

    function sameExecutionId(a, b) {
      if (a == null || b == null) return false;
      return String(a) === String(b);
    }

    /** When SSE re-sends summary rows without runData, keep a prior lazy-loaded timeline. */
    function fuseExecutionPreservingTimeline(previous, incoming) {
      if (!incoming) return incoming;
      if (!previous || !sameExecutionId(previous.id, incoming.id)) return incoming;
      const incEmpty = !(incoming.timeline && incoming.timeline.length);
      const prevRich = Array.isArray(previous.timeline) && previous.timeline.length > 0;
      if (!(prevRich && incEmpty)) return incoming;
      return {
        ...incoming,
        timeline: previous.timeline,
        nodeCount:
          typeof previous.nodeCount === 'number' && previous.nodeCount > 0
            ? previous.nodeCount
            : incoming.nodeCount,
        activatedNodeNames: previous.activatedNodeNames ?? incoming.activatedNodeNames,
        meta: previous.meta ?? incoming.meta,
        lastNodeExecuted: incoming.lastNodeExecuted || previous.lastNodeExecuted,
      };
    }

    async function hydrateTimelineIfNeeded(ex) {
      if (!ex || ex.id == null) return ex;
      const idKey = String(ex.id);
      if (Array.isArray(ex.timeline) && ex.timeline.length > 0) return ex;

      const stillRunning =
        ex.status === 'running' ||
        ex.status === 'waiting' ||
        (Array.isArray(ex.timeline) &&
          ex.timeline.some(
            (row) =>
              row && (row.executionStatus === 'running' || row.executionStatus === 'waiting'),
          ));

      if (!stillRunning && terminalEmptyHydrated.has(idKey)) {
        return executions.find((e) => sameExecutionId(e.id, idKey)) || ex;
      }

      const queued = hydrateInflightById.get(idKey);
      if (queued) {
        await queued.catch(() => {});
        return executions.find((e) => sameExecutionId(e.id, idKey)) || ex;
      }

      const promise = fetch(`/api/executions/${encodeURIComponent(idKey)}`)
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || res.statusText);
          const idx = executions.findIndex((e) => sameExecutionId(e.id, data.id ?? idKey));
          if (idx >= 0) executions[idx] = data;
          const runningish =
            data.status === 'running' ||
            data.status === 'waiting' ||
            data.timeline?.some(
              (row) =>
                row && (row.executionStatus === 'running' || row.executionStatus === 'waiting'),
            );
          if (!runningish && !(data.timeline?.length)) terminalEmptyHydrated.add(String(data.id ?? idKey));
          return executions.find((e) => sameExecutionId(e.id, data.id)) || data;
        })
        .catch((err) => {
          console.warn('hydrateTimelineIfNeeded:', err?.message || err);
          return ex;
        })
        .finally(() => {
          hydrateInflightById.delete(idKey);
        });

      hydrateInflightById.set(idKey, promise);
      return await promise;
    }

    function statusClass(s) {
      if (s === 'success') return 'status-ok';
      if (s === 'error' || s === 'crashed') return 'status-err';
      if (s === 'running' || s === 'waiting') return 'status-run';
      return '';
    }

    function fmtJson(obj) {
      try {
        return JSON.stringify(obj, null, 2);
      } catch {
        return String(obj);
      }
    }

    /** n8n ITaskDataConnections: flatten item json for readable diff */
    function prettyMainData(conn) {
      if (!conn) return '(none)';
      if (!conn.main) return fmtJson(conn);
      const out = [];
      conn.main.forEach((branch, bi) => {
        if (!branch) return;
        branch.forEach((items) => {
          if (!items || !items.length) return;
          items.forEach((item, ii) => {
            out.push({
              branch: bi,
              itemIndex: ii,
              json: item?.json,
              binaryKeys: item?.binary ? Object.keys(item.binary) : [],
            });
          });
        });
      });
      return fmtJson(out.length ? out : conn);
    }

    function formatResolvedInputs(ru) {
      if (!ru?.resolutions?.length)
        return '<p class="muted-note">No <code>source</code> linkage (often triggers) — inspect OUT below.</p>';
      const blocks = ru.resolutions.map((r, idx) => {
        if (!r.matched)
          return `<h4 class="io">Input lane ${idx} — unresolved</h4><pre class="src">${escapeHtml(fmtJson({ ref: r.ref, reason: r.reason }))}</pre>`;
        const ref = r.ref || {};
        const label = `[${idx}] from «${ref.previousNode || '?'}», parentRun=${r.parentRunOrdinalUsed}, branch=${ref.previousNodeOutput ?? 0}`;
        return `<h4 class="io">Input lane ${idx}</h4><div class="muted-note">${escapeHtml(label)}</div><pre class="src">${escapeHtml(prettyMainData(r.inferredInputSnippet))}</pre>`;
      });
      return blocks.join('');
    }

    function renderTimeline(timeline, ex) {
      if (!timeline || !timeline.length) {
        const st = ex?.status ?? '';
        if (ex?.id != null && terminalEmptyHydrated.has(String(ex.id))) {
          return '<p class="empty">No <code>runData</code> rows in this execution payload. Enable saving successful executions in n8n. The browser only shows the HTTP response — here, the same payload would appear under your <strong>Respond to Webhook</strong> / response node card <strong>OUT</strong> (<code>data.main</code>) once stored.</p>';
        }
        const runningish = st === 'running' || st === 'waiting';
        const msg = runningish
          ? 'No runData in the summary yet — it should fill once nodes execute (SSE + lazy load). Try expanding after a moment.'
          : 'No runData yet. If listing worked but this persists, open Settings → executions retention in n8n.';
        return `<p class="empty">${msg}</p>`;
      }
      return timeline.map((step, i) => {
        const hasErr = step.error;
        const execMs =
          typeof step.executionTimeMs === 'number' ? ` · ${escapeHtml(String(step.executionTimeMs))}ms` : '';
        const st = step.executionStatus ? ` · ${escapeHtml(step.executionStatus)}` : '';
        const errBlock = hasErr
          ? `<pre style="border:1px solid var(--err);margin-bottom:0.5rem">${escapeHtml(fmtJson(step.error))}</pre>`
          : '';
        const inpOverride = step.inputOverride
          ? `<h4 class="io">Input override <span style="text-transform:none;letter-spacing:0;color:var(--warn)">inputOverride</span></h4><pre class="src-sm">${escapeHtml(prettyMainData(step.inputOverride))}</pre>`
          : '';
        const srcRaw =
          step.source !== null && step.source !== undefined
            ? `<h4 class="io">Raw source <span style="text-transform:none;letter-spacing:0;color:var(--muted)">lineage refs</span></h4><pre class="src-sm">${escapeHtml(fmtJson(step.source))}</pre>`
            : '';
        const outPayload = escapeHtml(prettyMainData(step.output ?? step.data));
        const resolvedInputs = formatResolvedInputs(step.resolvedUpstream);

        return `
          <article class="node-card" data-node-idx="${i}">
            <div class="node-head" role="button" tabindex="0">
              <div>
                <strong>${i + 1}. ${escapeHtml(cardTitle(step))}</strong>
                <span style="color:var(--muted);font-size:0.75rem;margin-left:0.35rem">
                  t=${escapeHtml(String(step.startTime))} · ex=${escapeHtml(String(step.executionIndex))}${st}${execMs}
                </span>
              </div>
              <span style="font-size:0.75rem;color:var(--muted)">▼</span>
            </div>
            <div class="node-body">
              <h4 class="io">IN — into this activation</h4>
              ${resolvedInputs}
              ${inpOverride}
              ${srcRaw}
              <h4 class="io">OUT — after this node (data.main)</h4>
              ${errBlock}
              <pre class="tgt">${outPayload}</pre>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    /** Prefer server-derived display label; avoid literal "undefined" from sparse rows */
    function cardTitle(step) {
      if (!step) return '(unnamed node)';
      const d =
        typeof step.nodeDisplayName === 'string'
          ? step.nodeDisplayName.trim()
          : '';
      if (d && d !== 'undefined') return d;
      const n = typeof step.nodeName === 'string' ? step.nodeName.trim() : '';
      if (n && n !== 'undefined') return n;
      return '(unnamed node)';
    }

    function toggleCard(ev) {
      const card = ev.target.closest('.node-card');
      if (!card) return;
      card.classList.toggle('open');
    }

    function toggleAll(open) {
      document.querySelectorAll('#detail .node-card').forEach((c) => {
        c.classList.toggle('open', open);
      });
    }

    function renderWiringSnapshot(workflowData) {
      const conn = workflowData?.connections;
      if (!conn || typeof conn !== 'object') return '';
      const lines = [];
      for (const [from, slots] of Object.entries(conn)) {
        if (!slots?.main || !Array.isArray(slots.main)) continue;
        slots.main.forEach((branches, bi) => {
          if (!Array.isArray(branches)) return;
          branches.forEach((targets) => {
            if (!Array.isArray(targets)) return;
            targets.forEach((t) => {
              if (t?.node) lines.push(`${from} → ${t.node} (out branch ${bi})`);
            });
          });
        });
      }
      if (!lines.length) return '';
      const cap = lines.slice(0, 120);
      return `<details style="margin:0.65rem 0" open>
        <summary style="cursor:pointer;color:var(--accent);font-size:0.82rem;font-weight:600">Workflow wiring (canvas connections)</summary>
        <p class="muted-note" style="margin:0.35rem 0">Runtime data flow is still node-by-node below (IN/OUT per activation).</p>
        <pre class="src-sm">${escapeHtml(cap.join('\n'))}</pre>
        ${lines.length > 120 ? `<p class="muted-note">${lines.length - 120} more edges…</p>` : ''}
      </details>`;
    }

    function renderDetail(ex) {
      if (!ex) {
        $('detail').innerHTML = '<p class="empty">Select an execution.</p>';
        return;
      }
      const activated =
        Array.isArray(ex.activatedNodeNames) && ex.activatedNodeNames.length
          ? ex.activatedNodeNames.map((n) => `\`${escapeHtml(n)}\``).join(', ')
          : '—';
      const execId = ex?.id != null ? String(ex.id) : '—';
      const stLabel = ex?.status != null ? String(ex.status) : '—';
      const head = `
        <div style="margin-bottom:1rem">
          <div><strong>Execution</strong> <code>${escapeHtml(execId)}</code></div>
          <div style="font-size:0.85rem;color:var(--muted);margin-top:0.35rem">
            status: <span class="${statusClass(ex.status)}">${escapeHtml(stLabel)}</span>
            · last node: <code>${escapeHtml(ex.lastNodeExecuted != null ? String(ex.lastNodeExecuted) : '—')}</code>
            · ${Number.isFinite(ex.nodeCount) ? ex.nodeCount : ex.timeline?.length ?? 0} step runs · <strong>${ex.timeline?.length || 0}</strong> timeline rows
          </div>
          <div class="muted-note" style="margin-top:0.35rem">Nodes with runData in this exec: ${activated}</div>
          ${renderWiringSnapshot(ex.workflowData)}
          <div class="exec-tools">
            <button type="button" id="rigExpandAllBtn">Expand all</button>
            <button type="button" id="rigCollapseBtn">Collapse all</button>
          </div>
        </div>
      `;
      $('detail').innerHTML = head + renderTimeline(ex.timeline, ex);
      $('detail').querySelectorAll('.node-head').forEach((el) => {
        el.addEventListener('click', toggleCard);
      });
      const eb = $('detail').querySelector('#rigExpandAllBtn');
      const cb = $('detail').querySelector('#rigCollapseBtn');
      if (eb) eb.addEventListener('click', () => toggleAll(true));
      if (cb) cb.addEventListener('click', () => toggleAll(false));
      const running =
        ex.status === 'running' ||
        ex.timeline?.some((t) => t.executionStatus === 'running');
      if (running) toggleAll(true);
    }

    function renderExecList() {
      const box = $('execList');
      if (!executions.length) {
        box.innerHTML = '<p class="empty">No executions yet.</p>';
        return;
      }
      box.innerHTML = executions.map((ex) => {
        const active = sameExecutionId(ex.id, selectedId) ? 'active' : '';
        const t = ex.stoppedAt || ex.startedAt || '';
        return `
          <button type="button" class="${active}" data-id="${escapeHtml(ex.id)}">
            <div><span class="${statusClass(ex.status)}">${escapeHtml(ex.status)}</span> · <code style="font-size:0.75rem">${escapeHtml(String(ex.id).slice(0, 8))}…</code></div>
            <div class="exec-meta">${escapeHtml(t)} · ${ex.nodeCount} steps</div>
          </button>
        `;
      }).join('');

      box.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          selectedId = btn.getAttribute('data-id');
          let ex = executions.find((e) => e.id === selectedId);
          ex = await hydrateTimelineIfNeeded(ex);
          renderExecList();
          renderDetail(ex);
        });
      });
    }

    function setConnected(ok, msg) {
      $('connText').textContent = msg;
      $('connDot').className = 'dot' + (ok ? ' live' : '');
    }

    async function refreshHint() {
      try {
        const h = await fetch('/api/health').then((r) => r.json());
        $('wfPill').textContent = 'workflow: ' + (h.workflowName || '—');
        const kp = h.apiKey?.present ?? h.hasApiKey;
        if (!kp) {
          $('hint').textContent =
            'Set `N8N_API_KEY` on n8n-flow-monitor from n8n → Settings → n8n API, then recreate the container. Check GET /api/health for apiKey.byteLength.';
          setConnected(false, 'no API key');
          return;
        }
        if (h.apiKey?.matchesComposeFallbackPlaceholder === true) {
          $('hint').textContent =
            'Container still has the compose default API key placeholder — paste your UI-generated key into .env as N8N_API_KEY and run docker compose up -d --force-recreate n8n-flow-monitor.';
          setConnected(false, 'placeholder API key');
          return;
        }
        const wfRes = await fetch('/api/workflow');
        const wf = await wfRes.json();
        if (wf.error) {
          const parts = [wf.hint, wf.error];
          $('hint').textContent = parts.filter(Boolean).join(' — ');
          setConnected(false, 'workflow error');
          return;
        }
        $('hint').textContent = `Rig wired to «${wf.name}» (${wf.nodes?.length || 0} workflow nodes). Each card = one activation — IN lanes from parent outputs + lineage JSON + OUT payload.`;
        setConnected(true, 'live');
      } catch (e) {
        $('hint').textContent = e.message || String(e);
        setConnected(false, 'error');
      }
    }

    async function ingestPayload(data) {
      if (!data || !Array.isArray(data.executions)) return;
      const prevById = new Map();
      for (const e of executions) {
        if (e && e.id != null) prevById.set(String(e.id), e);
      }
      executions = data.executions.map((incoming) =>
        fuseExecutionPreservingTimeline(prevById.get(String(incoming.id)), incoming),
      );
      if (!executions.length) {
        selectedId = null;
        renderExecList();
        $('detail').innerHTML =
          '<p class="empty">No executions for this workflow yet. Trigger <code>/webhook/chat</code>. If runs exist in n8n but not here: enable saving successful executions &amp; check API key.</p>';
        return;
      }
      const prev = selectedId;
      const stillThere = prev != null && executions.some((e) => sameExecutionId(e.id, prev));
      if (!stillThere) selectedId = executions[0].id;
      renderExecList();
      const picked = executions.find((e) => e.id === selectedId) || executions[0];
      const ex = await hydrateTimelineIfNeeded(picked);
      renderExecList();
      renderDetail(ex);
    }

    function connectStream() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/stream');
      eventSource.addEventListener('hello', () => {
        setConnected(true, 'live');
      });
      eventSource.addEventListener('executions', (ev) => {
        try {
          void ingestPayload(JSON.parse(ev.data));
        } catch (e) {
          console.error(e);
        }
      });
      eventSource.addEventListener('apiproblem', (ev) => {
        try {
          const d = JSON.parse(ev.data);
          $('hint').textContent = 'API: ' + (d.message || ev.data);
        } catch { /* ignore */ }
        setConnected(false, 'api error');
      });
      eventSource.onerror = () => {
        setConnected(false, 'reconnecting…');
      };
    }

    refreshHint();
    connectStream();
  </script>
</body>
</html>
